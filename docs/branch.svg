<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">「ブランチ」タブ（イメージ）</title>
  <desc id="d">左に Claude Code の会話と入力欄、右にサイドパネル。パネルは「ブランチ」タブを開いている。見出しは「ブランチ 3」で、その下にリモートの URL がある。ブランチの一覧は 3 行で、選んだ feat/login は「↑2  次: push」。その下に経過が 8 段階で並び、済は緑の ✓、今は黄色の ●、これからは灰色の ○。最後に「push しますか？」の確認と、「はい」「いいえ」がある。一番下に、git と gh を読んだ時刻がある。</desc>

  <!-- 端末 -->
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="959" height="499" rx="10" fill="none" stroke="#3c3c3c"/>

  <!-- 左: 会話と入力欄 -->
  <text x="24" y="40" fill="#858585">&gt; commit して、push して</text>
  <text x="24" y="72" fill="#d4d4d4">● commit しました（a1b2c3d）。</text>
  <text x="24" y="98" fill="#d4d4d4">   push しますか？</text>

  <!-- 開閉ボタン -->
  <rect x="24" y="372" width="196" height="30" rx="4" fill="none" stroke="#b1b9f9"/>
  <text x="38" y="392" fill="#b1b9f9">サイドパネルの開閉</text>
  <!-- 入力欄 -->
  <rect x="24" y="414" width="352" height="62" rx="6" fill="none" stroke="#5a5a5a"/>
  <text x="40" y="450" fill="#858585">&gt;</text>

  <!-- 区切り -->
  <line x1="400" y1="0" x2="400" y2="500" stroke="#3c3c3c"/>

  <!-- 右: パネル -->
  <text x="424" y="40" fill="#d4d4d4" font-weight="bold">Session Desk</text>
  <line x1="424" y1="52" x2="936" y2="52" stroke="#3c3c3c"/>

  <!-- タブ（選択中は ▸ と太字） -->
  <text x="424" y="82" fill="#858585">定型文</text>
  <text x="504" y="82" fill="#858585">履歴</text>
  <text x="564" y="82" fill="#b1b9f9">▸</text>
  <text x="584" y="82" fill="#d4d4d4" font-weight="bold">ブランチ</text>

  <!-- 見出しとリモート -->
  <text x="424" y="116" fill="#d4d4d4" font-weight="bold">ブランチ 3</text>
  <text x="424" y="138" fill="#858585">origin  github.com/asama0101/session-desk</text>

  <!-- 一覧（右端が「今」。選択中は太字） -->
  <text x="424" y="170" fill="#b1b9f9" font-weight="bold">＊feat feat/login  ↑2  次: push</text>
  <text x="424" y="192" fill="#6fcf97">　docs docs/readme  マージ待ち</text>
  <text x="424" y="214" fill="#858585">　既定 main  既定</text>

  <!-- 選んだブランチの経過 -->
  <text x="424" y="252" fill="#6fcf97">✓ ブランチを切る  11/07 13:55</text>
  <text x="424" y="274" fill="#6fcf97">✓ 編集  11/07 13:58</text>
  <text x="424" y="296" fill="#6fcf97">✓ commit  11/07 14:20  2 件</text>
  <text x="424" y="318" fill="#f2c94c" font-weight="bold">● push  次: push</text>
  <text x="424" y="340" fill="#858585">○ PR</text>
  <text x="424" y="362" fill="#858585">○ レビュー</text>
  <text x="424" y="384" fill="#858585">○ マージ</text>
  <text x="424" y="406" fill="#858585">○ 削除</text>

  <!-- 質問 -->
  <text x="424" y="440" fill="#f2c94c">push しますか？</text>
  <text x="610" y="440" fill="#6fcf97">はい</text>
  <text x="662" y="440" fill="#ff6b80">いいえ</text>

  <!-- 最後に読んだ時刻 -->
  <text x="424" y="476" fill="#858585">git 14:21:05 / gh 14:21:00</text>
</svg>
