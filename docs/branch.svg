<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 928 524" width="928" height="524" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15" style="white-space:pre">
  <title id="t">「Git」タブ（イメージ）</title>
  <desc id="d">左に Claude Code の会話と入力欄、右にサイドパネル。パネルは「Git」タブを開いている（上のセッション帯は省略）。見出し「ブランチ 3」の下に、ローカルのフォルダと、リモートの名前と URL がある。ブランチの一覧は 3 行で、選んだ feat/login は「マージ待ち」。その下に、選んだブランチの経過が 8 段階で並ぶ。済は緑の ✓、今は黄色の ●、これからは灰色の ○。ブランチを切る・編集・commit・push・PR が済で、日時が右端にある。「マージ」の行が今で、「マージ待ち」の文、PR のリンク「PR #35」、「▶ マージ済みを伝える」のボタンが並ぶ。リリースと削除はこれから。一番下に、git と gh を読んだ時刻がある。</desc>

