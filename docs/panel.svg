  <rect x="712" y="559" width="74" height="10" fill="#3a3d44"/><rect x="712" y="559" width="10" height="10" fill="#6fcf97"/>
  <text x="806" y="568" fill="#6fcf97">11%</text>
  <text x="632" y="590" fill="#4fd6e0">main</text>
  <text x="682" y="590" fill="#d4d4d4">未 commit 0</text>
  <line x1="632" y1="629" x2="936" y2="629" stroke="#464a54"/>
  <text x="632" y="678" fill="#4fd6e0" font-weight="bold">定型文</text>
  <line x1="632" y1="682" x2="690" y2="682" stroke="#4fd6e0"/>
  <text x="728" y="678" fill="#858585">履歴</text>
  <text x="788" y="678" fill="#858585">Git</text>
