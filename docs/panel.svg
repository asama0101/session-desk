  <text x="826" y="194" fill="#6fcf97" font-weight="bold" text-anchor="end">58%</text>
  <text x="936" y="194" fill="#6fcf97" text-anchor="end">116k / 200k</text>
  <rect x="632" y="203" width="304" height="18" fill="#3a3d44"/>
