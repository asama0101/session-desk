<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">Session Desk のパネル（イメージ）</title>
  <desc id="d">左に Claude Code の会話と入力欄、右にサイドパネル。パネルは定型文タブを開いていて、上に新しい定型文を入れる入力欄があり、3 件の定型文に「送信」「上へ」「下へ」「削除」のボタン（上へ・下へはグレー）が付いている（先頭に「上へ」、末尾に「下へ」は出ない）。入力欄の上に「サイドパネルの開閉」ボタンがある。</desc>

  <!-- 端末 -->
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="959" height="499" rx="10" fill="none" stroke="#3c3c3c"/>

  <!-- 左: 会話と入力欄 -->
  <text x="24" y="40" fill="#858585">&gt; 残りのタスクは？</text>
  <text x="24" y="72" fill="#d4d4d4">● 未完了のタスクは 2 件です。</text>
  <text x="24" y="98" fill="#858585">   1. README の画像を足す</text>
  <text x="24" y="122" fill="#858585">   2. zip での導入手順を書く</text>

  <!-- 開閉ボタン -->
  <rect x="24" y="372" width="196" height="30" rx="4" fill="none" stroke="#b1b9f9"/>
  <text x="38" y="392" fill="#b1b9f9">サイドパネルの開閉</text>
  <!-- 入力欄 -->
  <rect x="24" y="414" width="560" height="62" rx="6" fill="none" stroke="#5a5a5a"/>
  <text x="40" y="450" fill="#858585">&gt;</text>

  <!-- 区切り -->
  <line x1="608" y1="0" x2="608" y2="500" stroke="#3c3c3c"/>

  <!-- 右: パネル -->
  <text x="632" y="40" fill="#d4d4d4" font-weight="bold">Session Desk</text>
  <line x1="632" y1="52" x2="936" y2="52" stroke="#3c3c3c"/>

  <!-- タブ（選択中は ▸ と太字） -->
  <text x="632" y="82" fill="#b1b9f9">▸</text>
  <text x="652" y="82" fill="#d4d4d4" font-weight="bold">定型文</text>
  <text x="732" y="82" fill="#858585">履歴</text>

  <!-- 入力欄（新しい定型文を足す） -->
  <rect x="632" y="104" width="304" height="26" rx="4" fill="none" stroke="#5a5a5a"/>
  <text x="644" y="122" fill="#858585">新しい定型文を入力して Enter</text>

  <!-- 定型文 1 -->
  <text x="632" y="172" fill="#d4d4d4">残りのタスクは？</text>
  <text x="632" y="196" fill="#b1b9f9">▶ 送信</text>
  <text x="702" y="196" fill="#858585">▼ 下へ</text>
  <text x="772" y="196" fill="#ff6b80">× 削除</text>

  <!-- 定型文 2（折り返し） -->
  <text x="632" y="242" fill="#d4d4d4">選択肢ごとにメリット・デメリットを</text>
  <text x="632" y="264" fill="#d4d4d4">明確にして推奨および影響をレポート</text>
  <text x="632" y="286" fill="#d4d4d4">して</text>
  <text x="632" y="310" fill="#b1b9f9">▶ 送信</text>
  <text x="702" y="310" fill="#858585">▲ 上へ</text>
  <text x="772" y="310" fill="#858585">▼ 下へ</text>
  <text x="842" y="310" fill="#ff6b80">× 削除</text>

  <!-- 定型文 3 -->
  <text x="632" y="356" fill="#d4d4d4">Artifact使ってデザインを見せて</text>
  <text x="632" y="380" fill="#b1b9f9">▶ 送信</text>
  <text x="702" y="380" fill="#858585">▲ 上へ</text>
  <text x="772" y="380" fill="#ff6b80">× 削除</text>
</svg>
