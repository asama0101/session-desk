<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 1004" width="960" height="1004" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">Session Desk のパネル（イメージ）</title>
  <desc id="d">左に Claude Code の会話と入力欄、右にサイドパネル。パネルは、上から順に、見出し（Session と Opus 5.5 / high）とディレクトリとゴールと停止中の状態、コンテキストの使用率 58% と色分けのバーと縦の凡例、5 時間枠と 7 日枠のバーとブランチ名、タブの行（定型文・履歴・Git。選んだ定型文は水色の太字に下線）、新しい定型文を入れる入力欄、3 件の定型文が並ぶ。各段は細い線で区切られる。定型文の操作は、どの行も「送信」「削除」「上へ」「下へ」の順で、先頭の上へと末尾の下へは薄い字。入力欄の上に「サイドパネルの開閉」ボタンがある。</desc>

  <!-- 端末 -->
  <rect x="0" y="0" width="960" height="1004" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="959" height="1003" rx="10" fill="none" stroke="#3c3c3c"/>

  <!-- 左: 会話と入力欄、開閉ボタン -->
  <text x="24" y="40" fill="#858585">&gt; 残りのタスクは？</text>
  <text x="24" y="72" fill="#d4d4d4">● 未完了のタスクは 2 件です。</text>
  <text x="24" y="98" fill="#858585">   1. README の画像を足す</text>
  <text x="24" y="122" fill="#858585">   2. zip での導入手順を書く</text>
  <rect x="24" y="876" width="196" height="30" rx="4" fill="none" stroke="#b1b9f9"/>
  <text x="38" y="896" fill="#b1b9f9">サイドパネルの開閉</text>
  <rect x="24" y="918" width="560" height="62" rx="6" fill="none" stroke="#5a5a5a"/>
  <text x="40" y="954" fill="#858585">&gt;</text>
  <line x1="608" y1="0" x2="608" y2="1004" stroke="#3c3c3c"/>

  <!-- 右: パネル（帯、タブ、定型文） -->
  <text x="632" y="40" fill="#d4d4d4" font-weight="bold">Session</text>
  <text x="724" y="40" fill="#d78bff" font-weight="bold">Opus 5.5</text>
  <text x="808" y="40" fill="#858585">/</text><text x="826" y="40" fill="#4fd6e0" font-weight="bold">high</text>
  <text x="632" y="62" fill="#858585">D:\claude\local-repo\session-desk</text>
  <text x="632" y="84" fill="#858585">ゴール</text>
  <text x="698" y="84" fill="#d4d4d4">帯と選択肢を足す</text>
  <text x="632" y="106" fill="#858585">停止中</text>
  <text x="702" y="106" fill="#d4d4d4">直近 1m42s</text>
  <text x="818" y="106" fill="#d4d4d4">18k tokens</text>
