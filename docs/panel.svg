  <desc id="d">左に Claude Code の会話と入力欄、右にサイドパネル。パネルは上から順に、見出し（Session と Opus 5.5 / high）、ディレクトリ、ゴール、停止中の状態、コンテキスト（使用率 58%、色分けのバー、凡例を出すボタン「▸ 凡例」。凡例は最初は隠れている）、自動 compact までの残りと「概算」「正確に数える」、5 時間枠と 7 日枠の使用率、ブランチ名、タブの行（定型文・履歴・Git）、3 件の定型文が並ぶ。コンテキストと利用枠のあいだに線はない。</desc>

