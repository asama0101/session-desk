<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 912" width="960" height="912" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">サイドパネルの全体（イメージ）</title>
  <desc id="d">右のサイドパネルは、上から順に、見出し（Session と Opus 5.5）、状態（ゴール、停止中と直近の時間とトークン数、サブエージェント 1 件）、コンテキスト（使用率 58% と色分けのバーと、1 行あけた縦の凡例と、自動 compact までの残りと正確に数えるボタン）、利用枠とブランチ（5 時間枠 32% と 7 日枠 11% のバー、ブランチ名と未 commit の数）、タブの行（定型文・履歴・Git）と選んだタブの内容で、段と段のあいだは細い線で区切られる。二重線の下に提案があり、番号つきの 3 つの選択肢が縦に並ぶ。勧める案には (推奨) が付く。</desc>

  <rect x="0" y="0" width="960" height="912" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="959" height="911" rx="10" fill="none" stroke="#3c3c3c"/>

  <!-- 左: 会話 -->
  <text x="24" y="40" fill="#858585">&gt; 方針を決めて</text>
  <text x="24" y="72" fill="#d4d4d4">● 案が 2 つあります。</text>
  <text x="24" y="98" fill="#858585">   A: 既存の関数を直す</text>
  <text x="24" y="122" fill="#858585">   B: 新しく作る</text>
  <rect x="24" y="800" width="196" height="30" rx="4" fill="none" stroke="#b1b9f9"/>
