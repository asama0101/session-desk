<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">サイドパネルの全体（イメージ）</title>
  <desc id="d">右のサイドパネルは、上から順に、モデル名の色の見出し帯（Session と Opus 5.5）、状態の面（ゴール、停止中のチップと直近の時間とトークン数、サブエージェント 1 件）、コンテキストの面（使用率 58% と色分けのバーと縦の凡例と自動 compact までの残りと正確に数えるボタン）、利用枠とブランチの面（5 時間枠 32% と 7 日枠 11% のバー、ブランチ名と未 commit の数）、タブの行（定型文・履歴・Git。選んだタブは水色の面）、タブの内容の面、提案の面が並ぶ。提案は番号つきの 3 つの選択肢で、勧める案に (推奨) が付く。</desc>

  <rect x="0" y="0" width="960" height="760" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="959" height="759" rx="10" fill="none" stroke="#3c3c3c"/>

  <!-- 左: 会話 -->
  <text x="24" y="40" fill="#858585">&gt; 方針を決めて</text>
  <text x="24" y="72" fill="#d4d4d4">● 案が 2 つあります。</text>
  <text x="24" y="98" fill="#858585">   A: 既存の関数を直す</text>
  <text x="24" y="122" fill="#858585">   B: 新しく作る</text>
  <rect x="24" y="672" width="196" height="30" rx="4" fill="none" stroke="#b1b9f9"/>
  <text x="38" y="692" fill="#b1b9f9">サイドパネルの開閉</text>
  <rect x="24" y="714" width="352" height="30" rx="6" fill="none" stroke="#5a5a5a"/>
  <text x="40" y="734" fill="#858585">&gt;</text>
  <line x1="400" y1="0" x2="400" y2="760" stroke="#3c3c3c"/>

  <!-- 見出し帯（モデルの系統の色。Opus は紫） -->
  <rect x="418" y="12" width="524" height="26" fill="#d78bff"/>
  <text x="430" y="31" fill="#14151a" font-weight="bold">Session</text>
  <text x="520" y="31" fill="#14151a" font-weight="bold">Opus 5.5</text>

  <!-- 状態の面 -->
  <rect x="418" y="46" width="524" height="104" fill="#23252b"/>
  <text x="430" y="68" fill="#858585">ゴール</text><text x="496" y="68" fill="#d4d4d4">帯と選択肢を足す</text>
  <rect x="430" y="78" width="64" height="20" fill="#8a8f9c"/><text x="440" y="93" fill="#14151a" font-weight="bold">停止中</text>
  <text x="510" y="93" fill="#d4d4d4">直近 1m42s</text><text x="626" y="93" fill="#d4d4d4">18k tokens</text>
  <text x="430" y="116" fill="#d4d4d4" font-weight="bold">サブエージェント 1</text><text x="640" y="116" fill="#858585">▴ 閉じる</text>
  <text x="442" y="138" fill="#7db4ff">●</text><text x="462" y="138" fill="#d4d4d4">Explore  実行中  調査  0m42s</text>

  <!-- コンテキストの面 -->
  <rect x="418" y="160" width="524" height="236" fill="#23252b"/>
  <text x="430" y="184" fill="#858585">コンテキスト</text>
  <text x="800" y="184" fill="#6fcf97" font-weight="bold" text-anchor="end">58%</text>
  <text x="926" y="184" fill="#d4d4d4" text-anchor="end">116k / 200k</text>
  <rect x="434" y="192" width="484" height="16" fill="#3a3d44"/>
  <rect x="434.0" y="192" width="145.2" height="16" fill="#61afef"/>
  <rect x="579.2" y="192" width="29.0" height="16" fill="#c678dd"/>
  <rect x="608.2" y="192" width="24.2" height="16" fill="#56b6c2"/>
  <rect x="632.4" y="192" width="19.4" height="16" fill="#7ec699"/>
  <rect x="651.8" y="192" width="9.7" height="16" fill="#e5c07b"/>
  <rect x="661.5" y="192" width="7.3" height="16" fill="#d19a66"/>
  <rect x="668.7" y="192" width="46.0" height="16" fill="#9aa0ab"/>
  <text x="436" y="232" fill="#61afef">■</text><text x="454" y="232" fill="#d4d4d4">メッセージ 60k</text>
  <text x="436" y="252" fill="#c678dd">■</text><text x="454" y="252" fill="#d4d4d4">MCP 12k</text>
  <text x="436" y="272" fill="#56b6c2">■</text><text x="454" y="272" fill="#d4d4d4">ツール 10k</text>
  <text x="436" y="292" fill="#7ec699">■</text><text x="454" y="292" fill="#d4d4d4">システム 8k</text>
  <text x="436" y="312" fill="#e5c07b">■</text><text x="454" y="312" fill="#d4d4d4">メモリ 4k</text>
  <text x="436" y="332" fill="#d19a66">■</text><text x="454" y="332" fill="#d4d4d4">スキル 3k</text>
  <text x="436" y="352" fill="#9aa0ab">■</text><text x="454" y="352" fill="#d4d4d4">その他 19k</text>
  <text x="430" y="384" fill="#858585">自動 compact まで あと 40k（閾値 137k）</text>
  <text x="780" y="384" fill="#858585">概算</text><text x="830" y="384" fill="#b1b9f9">正確に数える</text>

  <!-- 利用枠とブランチの面 -->
  <rect x="418" y="404" width="524" height="92" fill="#23252b"/>
  <text x="430" y="426" fill="#858585">5時間枠</text>
  <rect x="510" y="414" width="108" height="12" fill="#3a3d44"/><rect x="510" y="414" width="35" height="12" fill="#6fcf97"/>
  <text x="636" y="426" fill="#6fcf97">32%</text><text x="686" y="426" fill="#858585">残り 3h 10m</text>
  <text x="430" y="450" fill="#858585">7日枠</text>
  <rect x="510" y="438" width="108" height="12" fill="#3a3d44"/><rect x="510" y="438" width="12" height="12" fill="#6fcf97"/>
  <text x="636" y="450" fill="#6fcf97">11%</text>
  <text x="430" y="474" fill="#4fd6e0">feat/band-frame</text><text x="596" y="474" fill="#d4d4d4">未 commit 3</text>

  <!-- タブの行（選んだタブは水色の面） -->
  <rect x="418" y="506" width="76" height="22" fill="#4fd6e0"/><text x="430" y="522" fill="#14151a" font-weight="bold">定型文</text>
  <rect x="502" y="506" width="56" height="22" fill="#2c2f36"/><text x="512" y="522" fill="#d4d4d4">履歴</text>
  <rect x="566" y="506" width="56" height="22" fill="#2c2f36"/><text x="576" y="522" fill="#d4d4d4">Git</text>

  <!-- タブの内容の面 -->
  <rect x="418" y="536" width="524" height="84" fill="#23252b"/>
  <text x="430" y="558" fill="#d4d4d4">残りのタスクは？</text>
  <text x="430" y="578" fill="#b1b9f9">▶ 送信</text><text x="510" y="578" fill="#ff6b80">× 削除</text><text x="590" y="578" fill="#555a65">▲ 上へ</text><text x="670" y="578" fill="#858585">▼ 下へ</text>
  <text x="430" y="602" fill="#858585">（定型文は、どの行も 送信・削除・上へ・下へ の順）</text>

  <!-- 提案の面 -->
  <rect x="418" y="630" width="524" height="116" fill="#23252b"/>
  <text x="430" y="652" fill="#d4d4d4" font-weight="bold">提案</text><text x="480" y="652" fill="#858585">実装方針の確認待ち</text>
  <rect x="430" y="662" width="28" height="20" fill="#b1b9f9"/><text x="438" y="677" fill="#14151a" font-weight="bold">1</text>
  <text x="472" y="677" fill="#d4d4d4" font-weight="bold">A案で進める</text><text x="590" y="677" fill="#6fcf97" font-weight="bold">(推奨)</text>
  <rect x="430" y="690" width="28" height="20" fill="#b1b9f9"/><text x="438" y="705" fill="#14151a" font-weight="bold">2</text>
  <text x="472" y="705" fill="#d4d4d4">B案で進める</text>
  <rect x="430" y="718" width="28" height="20" fill="#b1b9f9"/><text x="438" y="733" fill="#14151a" font-weight="bold">3</text>
  <text x="472" y="733" fill="#d4d4d4">別の案を相談</text>
</svg>
