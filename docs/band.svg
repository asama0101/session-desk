<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 778" width="960" height="778" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace" font-size="15">
  <title id="t">サイドパネルの全体（イメージ）</title>
  <desc id="d">右のサイドパネルは、上から順に、見出し（Session と Opus 5.5 / high）とディレクトリ、状態（ゴール、停止中と直近の時間とトークン数、サブエージェント 1 件）、コンテキスト（使用率 58% と色分けのバーと、自動 compact までの残りと、概算・正確に数えるボタン・凡例を出すボタン「▸ 凡例」。凡例は最初は隠れている）、線をはさまない利用枠とブランチ（5 時間枠 32% と 7 日枠 11% のバー、ブランチ名と未 commit の数）、タブの行（定型文・履歴・Git）と選んだタブの内容で、状態・コンテキスト・タブのあいだは細い線で区切られる。二重線の下に提案があり、番号つきの 3 つの選択肢が縦に並ぶ。勧める案には (推奨) が付く。</desc>

